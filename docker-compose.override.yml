# Loaded automatically by `docker compose up` — development only.
# Source is bind-mounted and both apps hot-reload. Delete or rename this file
# (or use `docker compose -f docker-compose.yml up`) to run the production images.

services:
  db:
    ports:
      - "${DB_PORT:-5432}:5432"   # so you can attach Rider / psql from the host

  api:
    build:
      target: dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./weather-be:/src
      - /src/WeatherApp.API/bin
      - /src/WeatherApp.API/obj
      - /src/WeatherApp.Application/bin
      - /src/WeatherApp.Application/obj
      - /src/WeatherApp.Domain/bin
      - /src/WeatherApp.Domain/obj
      - /src/WeatherApp.Infrastructure/bin
      - /src/WeatherApp.Infrastructure/obj
      - nuget:/root/.nuget/packages

  web:
    build:
      target: dev
    ports: !override
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./weather-fe:/app
      - /app/node_modules

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: weather-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"          # desktop mode: no login screen
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro   # pre-registers the db server
      - pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  nuget:
  pgadmin:
